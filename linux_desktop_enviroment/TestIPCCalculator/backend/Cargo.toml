[package]
name = "calculator-service"
version = "0.1.0"
edition = "2024"

[dependencies]
bigdecimal = "0.4"
capnp = "0.27.2"
capnp-rpc = "0.27.1"
dirs = "7.0.0"
futures = "0.3.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.0", features = ["rt", "net", "macros", "signal"] }
tokio-util = { version = "0.7.20", features = ["compat"] }

[build-dependencies]
capnpc = "0.27.0"
