<?xml version="1.0"?>
<!-- A synthetic nine-slice frame with exact, distinct element sizes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <g transform="translate(5,7)">
    <rect id="decoration-topleft" x="0" y="0" width="10" height="20" fill="#f00"/>
    <rect id="decoration-top" x="10" y="0" width="30" height="20" fill="#0f0"/>
    <rect id="decoration-topright" x="40" y="0" width="12" height="20" fill="#00f"/>
    <rect id="decoration-left" x="0" y="20" width="10" height="30" fill="#ff0"/>
    <rect id="decoration-center" x="10" y="20" width="30" height="30" fill="#0ff"/>
    <rect id="decoration-right" x="40" y="20" width="12" height="30" fill="#f0f"/>
    <rect id="decoration-bottomleft" x="0" y="50" width="10" height="8" fill="#800"/>
    <rect id="decoration-bottom" x="10" y="50" width="30" height="8" fill="#080"/>
    <rect id="decoration-bottomright" x="40" y="50" width="12" height="8" fill="#008"/>
  </g>
  <!-- A hidden Inkscape layer: QtSvg still sees what is inside. -->
  <g style="display:none">
    <rect id="decoration-hint-top-margin" x="70" y="0" width="5" height="15"/>
  </g>
  <!-- Stroked shape: bounds include half the stroke on each side. -->
  <rect id="stroked" x="10" y="80" width="20" height="10" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Off the canvas. -->
  <rect id="outside" x="150" y="-40" width="20" height="10" fill="#123"/>
</svg>
