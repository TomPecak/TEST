<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <style>
    text { font-family: "DejaVu Sans", "Noto Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .title { font-size: 17px; font-weight: bold; }
    .lane { font-size: 13px; font-weight: bold; fill: #374151; }
    .ls { font-size: 11px; fill: #6b7280; }
    .s { font-size: 11px; fill: #4b5563; }
    .m { font-family: "DejaVu Sans Mono", "Noto Sans Mono", monospace; font-size: 12px; font-weight: bold; }
    .box { fill: #ffffff; stroke: #3b6fd8; stroke-width: 1.4; }
    .wbox { fill: #ffffff; stroke: #d97a1f; stroke-width: 1.4; }
    .file { fill: #f3f4f6; stroke: #8a919c; stroke-width: 1.4; }
    .arrow { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .use { stroke: #6b7280; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="20" y="30" class="title">Od pliku motywu do pikseli — i co jest liczone jak często</text>

  <!-- lanes -->
  <rect x="10" y="46" width="980" height="122" fill="#f5f8ff"/>
  <rect x="10" y="172" width="980" height="96" fill="#f7fbf8"/>
  <rect x="10" y="272" width="980" height="176" fill="#fffaf3"/>
  <rect x="10" y="452" width="980" height="136" fill="#fdf5f5"/>
  <text x="20" y="70" class="lane">raz na motyw</text>
  <text x="20" y="86" class="ls">ładowanie / zmiana</text>
  <text x="20" y="100" class="ls">opcji (~100 ms)</text>
  <text x="20" y="196" class="lane">raz na element</text>
  <text x="20" y="212" class="ls">× rozmiar w pikselach</text>
  <text x="20" y="226" class="ls">(wspólne dla okien)</text>
  <text x="20" y="296" class="lane">przy zmianie</text>
  <text x="20" y="312" class="lane">stanu okna</text>
  <text x="20" y="328" class="ls">rozmiar, aktywność,</text>
  <text x="20" y="342" class="ls">hover… (~4 µs)</text>
  <text x="20" y="476" class="lane">co klatkę</text>
  <text x="20" y="492" class="ls">tylko quady,</text>
  <text x="20" y="506" class="ls">zero rasteryzacji</text>

  <!-- lane 1 -->
  <rect x="160" y="58" width="150" height="98" rx="5" class="file"/>
  <text x="172" y="78" class="m">Se7enAero/</text>
  <text x="172" y="96" class="s">Se7enAerorc</text>
  <text x="172" y="111" class="s">decoration.svg(z)</text>
  <text x="172" y="126" class="s">close.svg, minimize…</text>
  <text x="172" y="141" class="s">metadata.desktop</text>
  <path d="M310,107 L345,107" class="arrow"/>
  <rect x="348" y="82" width="120" height="50" rx="5" class="box"/>
  <text x="362" y="104" class="m">Theme::load</text>
  <text x="362" y="121" class="s">theme_locator</text>
  <path d="M468,107 L500,107" class="arrow"/>
  <rect x="503" y="58" width="150" height="44" rx="5" class="box"/>
  <text x="515" y="77" class="m">ThemeConfig</text>
  <text x="515" y="93" class="s">metryki z pliku rc</text>
  <rect x="503" y="110" width="150" height="48" rx="5" class="box"/>
  <text x="515" y="129" class="m">SvgDocument ×N</text>
  <text x="515" y="146" class="s">2 uchwyty librsvg</text>
  <path d="M653,134 L686,134" class="arrow"/>
  <rect x="689" y="58" width="290" height="100" rx="5" class="box"/>
  <text x="701" y="78" class="m">FrameSvg</text>
  <text x="782" y="78" class="s">× 4 stany ramki + innerborder</text>
  <text x="701" y="96" class="s">marginesy, hinty, rozmiary elementów</text>
  <text x="701" y="118" class="m">ButtonFrameSet</text>
  <text x="824" y="118" class="s">× typ przycisku</text>
  <text x="701" y="136" class="s">≤ 8 FrameSvg (active, hover-inactive…)</text>
  <text x="701" y="150" class="s">+ zestaw „restore” dla maksymalizacji</text>

  <!-- lane 2 -->
  <rect x="160" y="184" width="270" height="72" rx="5" class="box"/>
  <text x="172" y="204" class="m">RasterCache::get(klucz)</text>
  <text x="172" y="222" class="s">klucz = (dokument, id elementu,</text>
  <text x="172" y="236" class="s">rozmiar px, kafelek) → stały wskaźnik</text>
  <text x="172" y="250" class="s">miss → SvgDocument::render_element()</text>
  <path d="M430,220 L470,220" class="arrow"/>
  <rect x="473" y="184" width="200" height="72" rx="5" class="box"/>
  <text x="485" y="204" class="m">Raster</text>
  <text x="485" y="222" class="s">obraz cairo ARGB32</text>
  <text x="485" y="236" class="s">(premultiplied) + slot na</text>
  <text x="485" y="250" class="s">dane backendu</text>
  <path d="M673,220 L713,220" class="arrow"/>
  <rect x="716" y="184" width="263" height="72" rx="5" class="wbox"/>
  <text x="728" y="204" class="m">gpu_texture(raster)</text>
  <text x="728" y="222" class="s">pierwsze użycie: wlr_texture,</text>
  <text x="728" y="236" class="s">kopia CPU zwalniana; potem</text>
  <text x="728" y="250" class="s">zwraca gotową teksturę</text>

  <!-- lane 3 -->
  <rect x="160" y="284" width="170" height="80" rx="5" class="wbox"/>
  <text x="172" y="304" class="m">WindowState</text>
  <text x="172" y="322" class="s">rozmiar klienta, active,</text>
  <text x="172" y="336" class="s">maximized, resizable,</text>
  <text x="172" y="350" class="s">dostępność przycisków</text>
  <path d="M330,324 L362,324" class="arrow"/>
  <rect x="365" y="284" width="190" height="80" rx="5" class="box"/>
  <text x="377" y="304" class="m">compute_geometry()</text>
  <text x="377" y="322" class="s">→ DecorationGeometry:</text>
  <text x="377" y="336" class="s">borders, frame, przyciski,</text>
  <text x="377" y="350" class="s">caption, bounds</text>
  <path d="M555,324 L587,324" class="arrow"/>
  <rect x="590" y="284" width="190" height="80" rx="5" class="box"/>
  <text x="602" y="304" class="m">FrameSvg::layout()</text>
  <text x="602" y="322" class="s">→ FramePiece: element,</text>
  <text x="602" y="336" class="s">dst w px urządzenia,</text>
  <text x="602" y="350" class="s">rozmiar rastra, kafelek?</text>
  <path d="M780,324 L812,324" class="arrow"/>
  <rect x="815" y="284" width="164" height="80" rx="5" class="box"/>
  <text x="827" y="304" class="m">append_*_items</text>
  <text x="827" y="322" class="s">→ vector&lt;DrawItem&gt;</text>
  <text x="827" y="336" class="s">(raster, src, dst)</text>
  <text x="827" y="350" class="s">cache: okno × skala</text>
  <rect x="365" y="380" width="415" height="56" rx="5" class="box"/>
  <text x="377" y="400" class="m">render_caption()</text>
  <text x="520" y="400" class="s">tytuł → tekstura szeroka jak tekst;</text>
  <text x="377" y="418" class="s">odświeżana tylko gdy zmieni się tekst/styl albo trzeba go skrócić „…”,</text>
  <text x="377" y="431" class="s">resize okna jedynie ją przesuwa</text>

  <!-- uses -->
  <path d="M694,158 L694,280" class="use"/>
  <path d="M832,284 L832,265 L300,265 L300,260" class="use"/>
  <text x="440" y="279" class="ls">append_* pobiera rastry z cache</text>

  <!-- lane 4 -->
  <rect x="160" y="466" width="260" height="104" rx="5" class="wbox"/>
  <text x="172" y="486" class="m">schedule_instructions()</text>
  <text x="172" y="504" class="s">damage ∩ (ramka − obszar klienta)</text>
  <text x="172" y="518" class="s">pusto → węzeł nic nie robi</text>
  <text x="172" y="540" class="s">hover/press uszkadza tylko przycisk,</text>
  <text x="172" y="554" class="s">zmiana tytułu tylko caption</text>
  <path d="M420,518 L452,518" class="arrow"/>
  <rect x="455" y="466" width="250" height="104" rx="5" class="wbox"/>
  <text x="467" y="486" class="m">DecorationNode::render()</text>
  <text x="467" y="504" class="s">items_for(skala) — z cache,</text>
  <text x="467" y="518" class="s">pomija quady poza damage;</text>
  <text x="467" y="532" class="s">kolejność: ramka, tytuł,</text>
  <text x="467" y="546" class="s">przyciski</text>
  <path d="M705,518 L737,518" class="arrow"/>
  <rect x="740" y="466" width="239" height="104" rx="5" class="wbox"/>
  <text x="752" y="486" class="m">render_pass_t</text>
  <text x="752" y="502" class="m">  ::add_texture()</text>
  <text x="752" y="522" class="s">tekstura + source_box → dst,</text>
  <text x="752" y="536" class="s">bilinear; renderer GLES/pixman</text>
  <text x="752" y="550" class="s">(tylko API render_pass)</text>

  <path d="M850,364 L850,446 L580,446 L580,462" class="use"/>
  <path d="M979,240 L986,240 L986,446 L920,446 L920,462" class="use"/>
  <text x="770" y="440" class="ls">DrawItem-y</text>
  <text x="926" y="440" class="ls">tekstury</text>
</svg>
