[package]
name = "files-service"
version = "0.1.0"
edition = "2024"

[dependencies]
capnp = "0.27.2"
capnp-rpc = "0.27.1"
dirs = "7.0.0"
futures = "0.3.34"
libc = "0.2.191"
mime_guess = "2.0.5"
notify = "8.2.0"
tokio = { version = "1.54.0", features = ["rt", "net", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
trash = "5.2.9"

[build-dependencies]
capnpc = "0.27.0"
